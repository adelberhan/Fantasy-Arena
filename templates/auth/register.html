{% extends "layouts/base.html" %} {% block title %} Register {% endblock %} {% block content %}

<div class="container py-5 auth">
  <h2 class="mb-4">Register</h2>
  {% include "components/flash_messages.html" %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label"> Username </label>

      <input class="form-control" name="username" required />
    </div>

    <div class="mb-3">
      <label class="form-label"> Password </label>

      <input type="password" autocomplete class="form-control" name="password" required />
    </div>

    <div class="mb-3">
      <label class="form-label"> Confirm Password </label>

      <input type="password" autocomplete class="form-control" name="confirm_password" required />
    </div>

    <button class="btn btn-success w-100">Register</button>
    <p class="mt-3 text-center text-muted">
      Do you have an account?
      <a href="{{ url_for('auth.login') }}"> Login </a>
    </p>
  </form>
</div>

{% endblock %}
